            switch (status) {
                case 'NED':
                    return 'bg-amber-100 text-amber-800 border-amber-200';
                case 'ED ง.':
                    return 'bg-emerald-100 text-emerald-800 border-emerald-200';
                case 'ED ค.':
                    return 'bg-purple-100 text-purple-800 border-purple-200';
                case 'ED ข.':
                    return 'bg-sky-100 text-sky-800 border-sky-200';
                case 'ED จ.2':
                    return 'bg-indigo-100 text-indigo-800 border-indigo-200';
                default:
                    return 'bg-slate-100 text-slate-800 border-slate-200';
            }
        }

        // Badge styling for Departments
        function getDeptBadgeClass(dept) {
            const map = {
                'ONCO': 'bg-rose-50 text-rose-700 border-rose-200',
                'HEMATO': 'bg-red-50 text-red-700 border-red-200',
                'NEURO': 'bg-cyan-50 text-cyan-700 border-cyan-200',
                'PSY': 'bg-violet-50 text-violet-700 border-violet-200',
                'CARDIO': 'bg-pink-50 text-pink-700 border-pink-200',
                'ENDOCRINE': 'bg-sky-50 text-sky-700 border-sky-200',
                'GI': 'bg-amber-50 text-amber-700 border-amber-200',
                'SURG': 'bg-orange-50 text-orange-700 border-orange-200',
                'ORTHO': 'bg-stone-50 text-stone-700 border-stone-200',
                'URO': 'bg-teal-50 text-teal-700 border-teal-200',
                'ESRD': 'bg-fuchsia-50 text-fuchsia-700 border-fuchsia-200',
                'MED': 'bg-slate-100 text-slate-700 border-slate-200',
                'SKIN': 'bg-lime-50 text-lime-700 border-lime-200',
                'PEDIATRICS': 'bg-emerald-50 text-emerald-700 border-emerald-200'
            };
            return map[dept] || 'bg-slate-100 text-slate-700 border-slate-200';
        }

        // Render Application logic on DOM Content Loaded
        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('drug-table-body');
            const searchInput = document.getElementById('search-input');
            const deptFilter = document.getElementById('dept-filter');
            const nlemFilter = document.getElementById('nlem-filter');
            const noResults = document.getElementById('no-results');
            const btnReset = document.getElementById('btn-reset-filters');
            const btnResetBar = document.getElementById('btn-reset-filters-bar');

            // Render Rows
            function renderTable(data) {
                tableBody.innerHTML = '';

                if (data.length === 0) {
                    noResults.classList.remove('hidden');
                    return;
                } else {
                    noResults.classList.add('hidden');
                }

                data.forEach((item, index) => {
                    const row = document.createElement('tr');
                    // Zebra Striping & Hover Effects
                    row.className = index % 2 === 0 
                        ? 'bg-white hover:bg-emerald-50/40 transition-colors' 
                        : 'bg-slate-50/60 hover:bg-emerald-50/40 transition-colors';

                    const deptBadges = item.depts.map(d => 
                        `<span class="inline-block px-2 py-0.5 text-xs font-normal rounded border ${getDeptBadgeClass(d)} mr-1 mb-1">${d}</span>`
                    ).join('');

                    row.innerHTML = `
                        <td class="py-3 px-4 text-center text-slate-500 font-normal">${item.id}</td>
                        <td class="py-3 px-4 font-normal text-slate-900 leading-snug">${item.name}</td>
                        <td class="py-3 px-4 font-normal text-slate-700">${item.strength}</td>
                        <td class="py-3 px-4 font-normal text-slate-600">${item.form}</td>
                        <td class="py-3 px-4 text-center">
                            <span class="inline-block px-2.5 py-0.5 text-xs font-normal rounded-full border ${getNlemBadgeClass(item.nlem)}">
                                ${item.nlem}
                            </span>
                        </td>
                        <td class="py-3 px-4 font-normal">
                            <div class="flex flex-wrap items-center">${deptBadges}</div>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }

            // Filter Engine
            function filterData() {
                const query = searchInput.value.trim().toLowerCase();
                const selectedDept = deptFilter.value;
                const selectedNlem = nlemFilter.value;

                const filtered = drugData.filter(item => {
                    // Text search
                    const matchesSearch = query === '' || 
                        item.name.toLowerCase().includes(query) ||
                        item.strength.toLowerCase().includes(query) ||
                        item.form.toLowerCase().includes(query) ||
                        item.depts.some(d => d.toLowerCase().includes(query));

                    // Dept filter
                    const matchesDept = selectedDept === 'ALL' || item.depts.includes(selectedDept);

                    // NLEM filter
                    const matchesNlem = selectedNlem === 'ALL' || item.nlem === selectedNlem;

                    return matchesSearch && matchesDept && matchesNlem;
                });

                renderTable(filtered);
            }

            // Reset action function
            function resetAllFilters() {
                searchInput.value = '';
                deptFilter.value = 'ALL';
                nlemFilter.value = 'ALL';
                filterData();
            }

            // Event Listeners
            searchInput.addEventListener('input', filterData);
            deptFilter.addEventListener('change', filterData);
            nlemFilter.addEventListener('change', filterData);

            if (btnReset) btnReset.addEventListener('click', resetAllFilters);
            if (btnResetBar) btnResetBar.addEventListener('click', resetAllFilters);

            // Initial Render
            renderTable(drugData);
        });
    </script>
</body>
</html>
